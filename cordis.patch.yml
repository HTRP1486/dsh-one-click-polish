# dsh-one-click-polish bundle patch.
#
# One insert mounts the Host half (HTTP routes + the polish model call). The
# browser half rides this same row through package.json `dsh.client`, because
# only a row named after the bare package carries a Client module.
#
# The row carries no `config` on purpose. The settings page writes this row's
# config into the profile patch layer, and dsh verifies a save by re-composing
# the entry and comparing it with what it just wrote. A `config: {}` here took
# part in that comparison and made every save after the first report
# "overridden by a home patch or command-line overlay". Leaving the field out
# lets the profile layer own the config outright.
- insert:
    - id: one-click-polish
      name: 'dsh-one-click-polish'
